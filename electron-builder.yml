appId: hn.dmedic.gestion
productName: DMedic
copyright: DMedic

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!out/main/verificar.js'

# El binario nativo de SQLite no puede ir empaquetado dentro del asar.
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Instalador-${version}.${ext}
  # Reescribir icono y metadatos del .exe exige que Windows permita crear enlaces
  # simbolicos (Modo Desarrollador o terminal como administrador). Se desactiva
  # para poder empaquetar sin privilegios elevados; reactivar cuando se compile
  # la version final con icono propio.
  signAndEditExecutable: false

# Version para Mac: se compila aparte (en un Mac o con GitHub Actions) y no
# afecta al instalador de Windows. Sin firma de Apple (identity: null), el
# cliente debe ejecutar una vez: xattr -cr /Applications/DMedic.app
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-Mac-${version}-${arch}.${ext}
  category: public.app-category.medical
  identity: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DMedic
  # Desinstalar nunca debe borrar expedientes: los datos viven en %APPDATA%\DMedic
  # (en Mac, ~/Library/Application Support/DMedic) y se conservan deliberadamente.
  deleteAppDataOnUninstall: false

# Las actualizaciones se publican como GitHub Releases. El programa solo descarga
# el instalador: ningún dato de pacientes sale de la computadora de la clínica.
publish:
  provider: github
  owner: proyecto1web100-png
  repo: dmedic
  releaseType: release
