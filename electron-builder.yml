appId: hn.dmedic.gestion
productName: DMedic
copyright: DMedic

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!out/main/verificar.js'

# El binario nativo de SQLite no puede ir empaquetado dentro del asar.
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Instalador-${version}.${ext}
  # Reescribir icono y metadatos del .exe exige que Windows permita crear enlaces
  # simbolicos (Modo Desarrollador o terminal como administrador). Se desactiva
  # para poder empaquetar sin privilegios elevados; reactivar cuando se compile
  # la version final con icono propio.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DMedic
  # Desinstalar nunca debe borrar expedientes: los datos viven en %APPDATA%\DMedic
  # y se conservan deliberadamente.
  deleteAppDataOnUninstall: false

# Las actualizaciones se publican como GitHub Releases. El programa solo descarga
# el instalador: ningún dato de pacientes sale de la computadora de la clínica.
# TODO: reemplazar "owner" por el usuario u organización real de GitHub.
publish:
  provider: github
  owner: CAMBIAR-POR-TU-USUARIO-DE-GITHUB
  repo: dmedic
  releaseType: release
